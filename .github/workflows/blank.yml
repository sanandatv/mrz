name: Update JSON

on:
  schedule:
    - cron: "*/10 * * * *"   # প্রতি ১০ মিনিটে
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JSON
        run: |
          curl --fail --silent --show-error \
            https://mrzplay.top/test/geo/nazmul.json \
            -o nazmul.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nazmul.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto update nazmul.json"
            git push
          fi
